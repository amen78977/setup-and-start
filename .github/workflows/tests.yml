name: skill-tests
on:
  push:
  pull_request:
jobs:
  stdlib-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q skills/setup-and-start/scripts
      - run: python -m unittest discover -s tests -v
      - run: python skills/setup-and-start/scripts/router.py doctor
      - run: python skills/setup-and-start/scripts/router.py route "تصميم واجهة عربية RTL" --stage build
      - run: python skills/setup-and-start/scripts/router.py plan "Build a backend API and UI" --project .
      - run: python skills/setup-and-start/scripts/router.py run "Improve backend API tests" --project .
      - run: python benchmarks/evaluate.py
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_browser_live.py -v
        env:
          SETUP_START_BROWSER_E2E: '1'
